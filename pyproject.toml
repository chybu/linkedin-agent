[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-tool"
version = "0.1.0"

dependencies = [
    "requests==2.33.0",
    "beautifulsoup4==4.14.3",
    "sqlalchemy==2.0.49",
    "psycopg[binary]==3.3.4",
    "lxml==6.0.2",
    "dbt-core==1.11.8",
    "dbt-postgres==1.10.0",
    "groq==0.37.1",
    "markitdown[pdf]==0.1.5",
    "ollama==0.6.2",
    "langchain-core==1.4.1",
    "langchain-groq==1.1.2",
    "pydantic==2.13.4",
    "mcp[cli]>=1.27.2"
]

[tool.setuptools.packages.find]
where = ["src"]