services:
  postgres:
    image: postgres:14.20
    container_name: linkedin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobsdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgresql_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jobsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5.4.1
    container_name: linkedin_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9
    container_name: linkedin_open_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: lifeisgoodnevergiveup
      OPENAI_API_BASE_URL: http://groq-proxy:8000/v1
      OPENAI_API_KEY: decoy-pass
    volumes:
      - open_webui_data:/app/backend/data

  groq-proxy:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.groq-proxy
    container_name: linkedin_groq_proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./.secrets.toml:/app/.secrets.toml:ro

volumes:
  postgres_data:
  open_webui_data:
